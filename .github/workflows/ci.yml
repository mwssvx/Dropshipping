name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @sf/web build
      # The merchant app's web build, which e2e/app.spec.ts drives on a phone-sized screen.
      - run: pnpm --filter @sf/mobile export:web
        env: { EXPO_OFFLINE: "1", EXPO_PUBLIC_API_URL: "http://localhost:3100" }
      - run: pnpm --filter @sf/web exec playwright install --with-deps chromium
      - run: pnpm e2e
